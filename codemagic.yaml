workflows:
  gameforge-debug-signing:
    name: GameForge signing debug
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: vildsvar-app-store-connect

    environment:
      xcode: 26.6
      vars:
        P12_PASSWORD: gameforge-p12

    scripts:
      - name: Manual signing test
        script: |
          mkdir -p build
          export HOMEBREW_NO_AUTO_UPDATE=1
          {
            echo "=== create distribution certificate ==="
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --p12-path "$CM_BUILD_DIR/build/gameforge-dist.p12" \
              --p12-password "$P12_PASSWORD" \
              --json || true
            echo "=== import p12 into keychain ==="
            security import "$CM_BUILD_DIR/build/gameforge-dist.p12" \
              -k ~/Library/Keychains/login.keychain-db \
              -P "$P12_PASSWORD" -T /usr/bin/codesign || true
            security find-identity -v -p codesigning || true
            echo "=== list distribution certs ==="
            app-store-connect certificates list --type IOS_DISTRIBUTION --json || true
          } 2>&1 | tee build/debug-signing.log

    artifacts:
      - build/debug-signing.log

  gameforge-testflight:
    name: GameForge TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: vildsvar-app-store-connect

    environment:
      xcode: 26.6
      groups:
        - gameforge-signing   # GAMEFORGE_P12_ENC_PASSWORD (secure) — see .env/gameforge-signing.env
      vars:
        P12_PASSWORD: gameforge-p12
        BUNDLE_ID_RESOURCE_ID: K4G2H6JYJJ
        TEAM_ID: JDW2B73SS5
        PROFILE_NAME: gameforge-build
      # NOTE: no `ios_signing:` block on purpose. The environment.ios_signing
      # block triggers Codemagic's signing pre-check which fails with
      # "No matching profiles found" because this app (unlike Vildsvar) has no
      # per-app stored "Code signing identities". We do all signing manually
      # below — see docs/HANDOFF.md.

    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Run GameCore tests
        script: swift test
        working_directory: $CM_BUILD_DIR/Packages/GameCore

      - name: Manual signing — certificate, keychain, profile
        script: |
          set -e
          mkdir -p build

          # 1. Reuse persisted certificate if we have one (Apple caps
          #    Apple Distribution certs at 3). First run creates one and the
          #    p12 is persisted via a Codemagic env var group afterwards.
          if [ -n "${GAMEFORGE_P12_ENC_PASSWORD:-}" ]; then
            # Reuse persisted certificate: decrypt the p12 committed to the repo.
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
              -in signing/gameforge-dist.p12.enc \
              -out build/gameforge-dist.p12 \
              -pass pass:"$GAMEFORGE_P12_ENC_PASSWORD"
            ls -la build/gameforge-dist.p12
            # Extract the private key from the p12 and match the ASC cert by
            # key — with two active Distribution certs, list order alone can
            # pick the wrong one. The CLI requires the file to contain ONLY
            # the PEM key (must start with "-----BEGIN"), so drop the bag
            # attributes that openssl pkcs12 emits.
            openssl pkcs12 -in build/gameforge-dist.p12 \
              -passin "pass:$P12_PASSWORD" -nocerts -nodes 2>/dev/null \
              | sed -n '/-----BEGIN PRIVATE KEY-----/,/-----END PRIVATE KEY-----/p' \
              > build/dist.key
            CERT_ID=$(app-store-connect certificates list --type DISTRIBUTION \
              --certificate-key "@file:$CM_BUILD_DIR/build/dist.key" --json \
              | python3 -c "import json,sys; d=json.load(sys.stdin); d=d['data'] if isinstance(d, dict) and 'data' in d else d; print(d[0]['id'])")
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out build/dist.key
            CREATE_OUT=$(app-store-connect certificates create \
              --type DISTRIBUTION \
              --certificate-key "$(cat build/dist.key)" \
              --p12-path "$CM_BUILD_DIR/build/gameforge-dist.p12" \
              --p12-password "$P12_PASSWORD" \
              --save \
              --json)
            CERT_ID=$(echo "$CREATE_OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); d=d['data'] if isinstance(d, dict) and 'data' in d else d; print(d['id'])")
            echo "CERT_ID=$CERT_ID"
            echo "IMPORTANT: after this build succeeds, base64-encode build/gameforge-dist.p12"
            echo "and store it as GAMEFORGE_DIST_P12_BASE64 in a Codemagic env var group."
          fi

          # 2. Import p12 into login keychain
          security import build/gameforge-dist.p12 \
            -k ~/Library/Keychains/login.keychain-db \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security find-identity -v -p codesigning

          # 3. Create/renew profile including THIS cert. Old profiles bound to
          #    a previous cert would not match the keychain identity, so
          #    delete a stale one of the same name first.
          OLD_PROFILE_ID=$(app-store-connect profiles list --json | python3 -c "import json,sys; [print(p['id']) for p in json.load(sys.stdin) if p['attributes']['name'] == '$PROFILE_NAME']" | head -1 || true)
          if [ -n "$OLD_PROFILE_ID" ]; then
            echo "Deleting stale profile $OLD_PROFILE_ID"
            app-store-connect profiles delete "$OLD_PROFILE_ID" --ignore-not-found || true
          fi
          app-store-connect profiles create "$BUNDLE_ID_RESOURCE_ID" \
            --certificate-ids "$CERT_ID" \
            --type IOS_APP_STORE \
            --name "$PROFILE_NAME" --save

      - name: Archive with manual signing
        script: |
          set -e
          # errSecInternalComponent fix: unlock the login keychain and allow
          # codesign to use imported keys without an interactive prompt.
          keychain initialize
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db || true
          xcodebuild archive \
            -project GameForge.xcodeproj -scheme GameForge \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/GameForge.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER

      - name: Export IPA
        script: |
          set -e
          cat > build/exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>JDW2B73SS5</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>dev.adrez.gameforge</key><string>gameforge-build</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/GameForge.xcarchive \
            -exportOptionsPlist build/exportOptions.plist \
            -exportPath build/ipa

    artifacts:
      - build/ipa/*.ipa
      - build/gameforge-dist.p12
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
