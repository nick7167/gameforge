workflows:
  gameforge-debug-signing:
    name: GameForge signing debug
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: vildsvar-app-store-connect

    environment:
      xcode: 26.6
      vars:
        P12_PASSWORD: gameforge-p12

    scripts:
      - name: Manual signing test
        script: |
          mkdir -p build
          export HOMEBREW_NO_AUTO_UPDATE=1
          {
            echo "=== create distribution certificate ==="
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --p12-path "$CM_BUILD_DIR/build/gameforge-dist.p12" \
              --p12-password "$P12_PASSWORD" \
              --json || true
            echo "=== import p12 into keychain ==="
            security import "$CM_BUILD_DIR/build/gameforge-dist.p12" \
              -k ~/Library/Keychains/login.keychain-db \
              -P "$P12_PASSWORD" -T /usr/bin/codesign || true
            security find-identity -v -p codesigning || true
            echo "=== list distribution certs ==="
            app-store-connect certificates list --type IOS_DISTRIBUTION --json || true
          } 2>&1 | tee build/debug-signing.log

    artifacts:
      - build/debug-signing.log

  gameforge-testflight:
    name: GameForge TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: vildsvar-app-store-connect

    environment:
      xcode: 26.6
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.adrez.gameforge

    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Run GameCore tests
        script: swift test
        working_directory: $CM_BUILD_DIR/Packages/GameCore

      - name: Apply Apple signing profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/GameForge.xcodeproj" \
            --scheme GameForge \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
