name: GameForge

options:
  bundleIdPrefix: dev.adrez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

packages:
  GameCore:
    path: Packages/GameCore
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/googleads-mobile-ios-examples.git
    from: 11.0.0

targets:
  GameForge:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: GameCore
      - package: RevenueCat
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrez.gameforge
        PRODUCT_NAME: GameForge
        INFOPLIST_KEY_CFBundleDisplayName: GameForge
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Export compliance: app uses only Apple's standard OS encryption
        # (HTTPS etc.) — no proprietary crypto. false = exempt, so TestFlight
        # builds skip the "Missing Compliance" manual step entirely.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # AdMob test app ID (Google's official test value) — replace with the
        # real one when the AdMob account is set up. CI builds work with this.
        INFOPLIST_KEY_GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # RevenueCat public API key — replace via a private xcconfig when set up.
        # Empty/missing = purchases no-op and the game stays fully playable.
        INFOPLIST_KEY_REVENUECAT_API_KEY: ""
        CURRENT_PROJECT_VERSION: "1"

  GameForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: GameForge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GameForge:
    build:
      targets:
        GameForge: all
        GameForgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GameForgeTests
