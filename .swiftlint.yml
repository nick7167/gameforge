disabled_rules:
  - trailing_whitespace
  - todo

line_length:
  warning: 150
  error: 200

identifier_name:
  min_length: 2
  excluded:
    - x
    - y
    - z
    - a
    - b
    - id

# SwiftPM build artifacts (generated, not in git) — exclude everywhere.
excluded:
  - .build
  - Packages/GameCore/.build
